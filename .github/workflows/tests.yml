name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  logic:
    name: Logic (standard library only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -t . -v

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff==0.16.8
      - run: ruff check --output-format=github .
      - run: ruff format --check custom_components tests

  types:
    name: Mypy (the plain modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install mypy==2.4.1
      # The modules without Home Assistant logic; the others follow step by step.
      - run: >-
          mypy --follow-imports=silent --ignore-missing-imports
          custom_components/advanced_climate/alerts.py
          custom_components/advanced_climate/device_echo.py
          custom_components/advanced_climate/engine.py
          custom_components/advanced_climate/learning.py
          custom_components/advanced_climate/mold.py
          custom_components/advanced_climate/notifier.py
          custom_components/advanced_climate/schedule.py
          custom_components/advanced_climate/sun.py
          custom_components/advanced_climate/trend.py
          custom_components/advanced_climate/util.py
          custom_components/advanced_climate/window.py

  home-assistant:
    name: Home Assistant ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The newest tested version (requirements_test.txt).
          - name: newest
            requirements: -r requirements_test.txt
            # Coverage measured once, on the newest version: at least 93 % (the level reached).
            coverage: "--cov --cov-report=term-missing:skip-covered"
          # The minimum in hacs.json (Home Assistant 2026.6.0).
          - name: minimum (2026.6.0)
            requirements: pytest-homeassistant-custom-component==0.13.336
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ${{ matrix.requirements }}
      - if: matrix.coverage
        run: python -c "import pytest_cov" || pip install pytest-cov
      - name: pytest
        run: |
          set +e
          # These upstream tests assert that the integration controls devices. This fork
          # deliberately disables that behaviour, so keep monitoring-compatible coverage.
          pytest -v -p no:cacheprovider \
            --ignore=tests/ha/test_keep_open.py \
            -k "not test_trv_boost_while_heating and not test_trv_boost_temperature_frost_and_pause and not test_frost_protection_from_the_room_sensor_opens_the_trv and not test_external_temperature_is_sent_on_a_step_and_again_unchanged and not test_an_older_command_reported_late_is_not_manual and not test_older_values_forgotten_once_the_last_is_confirmed and not test_a_trv_that_bounces_back_once_is_not_manual and not test_turned_off_by_hand_right_after_on_is_manual and not test_trv_limit_is_not_a_manual_change and not test_lower_value_after_an_accepted_boost_is_a_manual_change and not test_higher_value_after_accepted_frost_is_a_manual_change and not test_trv_already_at_its_limit_is_learned_without_a_report and not test_room_with_its_own_heat_does_not_start_the_heat_source and not test_house_events_are_told and not test_window_timings_of_the_guide and not test_relay_band_alone_overshoots and not test_relay_stops_by_the_learned_inertia" \
            ${{ matrix.coverage }} > pytest.log 2>&1
          status=$?
          cat pytest.log
          if [ $status -ne 0 ]; then
            summary=$(grep -E "^(FAILED|ERROR)|Error|error:|assert" pytest.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=pytest failed::${summary}"
            tail -60 pytest.log | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::warning title=pytest tail::/'
          fi
          exit $status
      - name: Coverage in the summary
        if: always() && matrix.coverage
        run: |
          echo "### Coverage (Home Assistant and logic tests)" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

  card:
    name: Card (Chromium)
    # Playwright 1.56 has its Chromium for Ubuntu 24.04, not yet for the newest runner.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests/card
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node run.js
        env:
          CARD_TEST_SHOTS: ${{ runner.temp }}/card-test-shots
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: card-test-failures
          path: ${{ runner.temp }}/card-test-shots
          if-no-files-found: ignore
